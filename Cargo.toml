[package]
name = "swarmkeeper"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
