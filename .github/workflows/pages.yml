name: Test, build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ runner.os }}-rust-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Install frontend tooling
        run: npm ci
      - name: Check formatting and source
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          npm run check
          npm run format:check
      - name: Test simulation and complete a survival run
        run: |
          cargo test --locked --release
          cargo run --locked --release --example run_check -- 9371 fork
      - name: Install matching WebAssembly bindings generator
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q '0.2.128'; then
            cargo install wasm-bindgen-cli --version 0.2.128 --locked
          fi
      - name: Build the deployable browser game
        run: npm run build
      - name: Cache the verified native and WebAssembly build
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Test game startup and continuous evolution music
        run: npm run test:browser
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static game
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
